<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E9C8A">
<title>个人办公工作台</title>
<style>
  :root{
    --bg:#EEF3F4; --panel:#FFFFFF; --ink:#15202B; --ink-2:#3A4750; --muted:#6B7B83; --line:#E3EBED; --line-2:#D8E3E5;
    --teal:#0E9C8A; --teal-d:#0A7D6E; --teal-l:#E6F5F2; --teal-ll:#F1FBF9;
    --blue:#2F6FED; --blue-d:#1F57C9; --blue-l:#E8F0FE;
    --red:#E5484D; --red-bg:#FDECEC; --red-line:#F4C5C7;
    --amber:#E8941A; --amber-bg:#FDF3E3; --amber-line:#F2DDAE;
    --green:#2BA24C; --green-bg:#E9F6EC;
    --purple:#7A45C9; --purple-bg:#F0EAFB;
    --shadow:0 1px 3px rgba(16,40,46,.06),0 6px 20px rgba(16,40,46,.05);
    --shadow-sm:0 1px 2px rgba(16,40,46,.05),0 2px 6px rgba(16,40,46,.04);
    --shadow-md:0 4px 14px rgba(16,40,46,.08),0 1px 3px rgba(16,40,46,.05);
    --shadow-lg:0 12px 32px rgba(16,40,46,.12);
    --radius:16px; --radius-sm:11px;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#cfd9dd;border-radius:8px;}

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:228px;flex:0 0 228px;background:#0F2A2B;color:#D7E4E2;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .brand{padding:22px 20px 14px;}
  .brand h1{font-size:17px;margin:0;font-weight:700;color:#fff;letter-spacing:.5px;}
  .brand p{margin:4px 0 0;font-size:12px;color:#8FB0AB;}
  .nav{padding:8px 12px;flex:1;overflow:auto;}
  .nav button{
    width:100%;display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;
    color:#C5D8D5;font-size:14.5px;text-align:left;margin-bottom:3px;transition:.15s;
  }
  .nav button svg{width:20px;height:20px;flex:0 0 20px;}
  .nav button:hover{background:rgba(255,255,255,.07);color:#fff;}
  .nav button.active{background:var(--teal);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(14,156,138,.35);}
  .nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;
    min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
  .side-foot{padding:14px 18px;font-size:11px;color:#7E9C97;border-top:1px solid rgba(255,255,255,.07);}

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(244,247,248,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;
    padding-bottom:calc(12px + env(safe-area-inset-top));padding-top:calc(12px + env(safe-area-inset-top));
  }
  .topbar .title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .topbar .title svg{width:22px;height:22px;color:var(--teal);}
  .save-state{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);transition:.3s;}
  .dot.flash{background:var(--teal);transform:scale(1.5);}
  .spacer{flex:1;}
  .tbtn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;font-size:13px;font-weight:600;
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);min-height:40px;
  }
  .tbtn svg{width:16px;height:16px;}
  .tbtn.primary{background:var(--teal);color:#fff;border-color:var(--teal);}
  .tbtn.ghost{background:transparent;}

  .banner{
    margin:16px 22px 0;background:linear-gradient(100deg,#0E9C8A,#2F6FED);
    border-radius:var(--radius);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    box-shadow:0 8px 24px rgba(14,156,138,.22);position:relative;overflow:hidden;
  }
  .banner .deco{position:absolute;right:-10px;top:-30px;opacity:.18;}
  .banner .stat{display:flex;flex-direction:column;line-height:1.15;}
  .banner .stat b{font-size:22px;font-weight:800;}
  .banner .stat span{font-size:12px;opacity:.9;}
  .banner .stat.alert b{color:#FFE08A;}
  .banner .lead{font-size:13px;opacity:.92;margin-left:auto;max-width:240px;}

  .content{padding:18px 22px 40px;flex:1;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .card h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .card h2 svg{width:18px;height:18px;color:var(--teal);}
  .card h2 .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:880px){.grid2{grid-template-columns:1fr;}}

  /* forms */
  .form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--muted);font-weight:600;}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;min-height:44px;outline:none;transition:.15s;width:100%;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l);}
  .field.grow{flex:1;min-width:160px;}
  textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;
    background:var(--teal);color:#fff;font-weight:600;font-size:14px;min-height:44px;border:1px solid var(--teal);
  }
  .btn:hover{background:var(--teal-d);}
  .btn.blue{background:var(--blue);border-color:var(--blue);}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.sm{padding:7px 12px;font-size:12.5px;min-height:36px;border-radius:8px;}
  .btn.danger{background:#fff;color:var(--red);border:1px solid var(--red-line);}
  .btn.danger:hover{background:var(--red-bg);}

  /* lists */
  .sect-title{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 9px;display:flex;align-items:center;gap:8px;}
  .sect-title .line{flex:1;height:1px;background:var(--line);}
  .sect-title .cnt{background:var(--teal-l);color:var(--teal-d);font-size:11px;padding:2px 8px;border-radius:8px;font-weight:700;}
  .sect-title.overdue{color:var(--red);}
  .sect-title.overdue .cnt{background:var(--red-bg);color:var(--red);}

  .item{
    display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;
    margin-bottom:9px;background:#fff;transition:.15s;
  }
  .item:hover{border-color:#cfe0dc;box-shadow:var(--shadow);}
  .item.over{background:var(--red-bg);border-color:var(--red-line);}
  .item.done{opacity:.6;}
  .ck{width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:2px solid #c7d3d0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .ck.on{background:var(--teal);border-color:var(--teal);}
  .ck.on svg{width:14px;height:14px;color:#fff;}
  .item .body{flex:1;min-width:0;}
  .item .txt{font-weight:600;word-break:break-word;}
  .item.done .txt{text-decoration:line-through;color:var(--muted);}
  .item .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;align-items:center;}
  .pill{font-size:11px;padding:2px 9px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
  .pill.p-high{background:var(--red-bg);color:var(--red);}
  .pill.p-medium{background:var(--amber-bg);color:var(--amber);}
  .pill.p-low{background:var(--blue-l);color:var(--blue);}
  .pill.date{background:#EDF1F2;color:var(--muted);}
  .pill.proj{background:var(--teal-l);color:var(--teal-d);}
  .pill.defer{background:#F0EAFB;color:#7A45C9;}
  .item .acts{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
  .iconbtn{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:#F2F6F6;border:1px solid var(--line);color:var(--muted);}
  .iconbtn:hover{background:#E7EEEC;color:var(--ink);}
  .iconbtn svg{width:17px;height:17px;}
  .iconbtn.red{color:var(--red);}

  /* tags */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{font-size:12.5px;padding:6px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);font-weight:600;color:var(--muted);}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .chip .x{margin-left:5px;opacity:.7;}

  /* project cards */
  .proj{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px;background:#fff;}
  .proj.blocked{border-color:var(--red-line);background:linear-gradient(180deg,var(--red-bg),#fff 60%);}
  .proj .phead{display:flex;align-items:center;gap:10px;}
  .proj .pname{font-size:15.5px;font-weight:700;}
  .proj .pflag{font-size:11px;font-weight:700;color:var(--red);background:var(--red-bg);padding:2px 8px;border-radius:8px;border:1px solid var(--red-line);}
  .proj .steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  @media(max-width:600px){.proj .steps{grid-template-columns:1fr;}}
  .step{background:#F6F9F9;border-radius:10px;padding:10px 12px;}
  .step .k{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px;}
  .step .v{font-size:13.5px;word-break:break-word;}
  .step.block .v{color:var(--red);}
  .progress{margin-top:12px;}
  .progress .bar{height:9px;background:#EDF1F2;border-radius:6px;overflow:hidden;}
  .progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:6px;transition:.4s;}
  .progress .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .linked{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;}
  .linked .li{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13.5px;}
  .linked .li .ck{width:18px;height:18px;flex:0 0 18px;}
  .linked .li .ck.on svg{width:11px;height:11px;}

  /* review */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  @media(max-width:760px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .kpi b{display:block;font-size:28px;font-weight:800;color:var(--teal);line-height:1.1;}
  .kpi span{font-size:12.5px;color:var(--muted);}
  .kpi.amber b{color:var(--amber);} .kpi.blue b{color:var(--blue);} .kpi.red b{color:var(--red);}
  .chart-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:13px;}
  .legend .lg{display:flex;align-items:center;gap:8px;color:var(--muted);}
  .legend .sw{width:11px;height:11px;border-radius:3px;}
  .bars{display:flex;flex-direction:column;gap:10px;flex:1;min-width:200px;}
  .barrow{display:flex;align-items:center;gap:10px;font-size:13px;}
  .barrow .nm{width:120px;flex:0 0 120px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .barrow .track{flex:1;height:14px;background:#EDF1F2;border-radius:8px;overflow:hidden;}
  .barrow .track i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:8px;}
  .barrow .vv{width:54px;flex:0 0 54px;text-align:right;color:var(--muted);font-weight:600;}
  .trend{display:flex;align-items:flex-end;gap:8px;height:90px;padding-top:8px;}
  .trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
  .trend .col .b{width:100%;background:linear-gradient(180deg,var(--teal),var(--teal-d));border-radius:6px 6px 0 0;min-height:3px;transition:.3s;}
  .trend .col .d{font-size:10px;color:var(--muted);}
  .blockers li{margin-bottom:9px;font-size:13.5px;list-style:none;padding-left:22px;position:relative;}
  .blockers li::before{content:"";position:absolute;left:4px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--red);}
  .blockers .pj{font-weight:700;color:var(--ink);}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:20px 0;}

  /* reminder + toast */
  .remind{background:var(--amber-bg);border:1px solid #F2DDAE;color:#8a5a06;border-radius:12px;padding:12px 14px;margin:0 22px 0;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;}
  .remind button{margin-left:auto;color:#8a5a06;text-decoration:underline;font-weight:700;}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1F2A30;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;z-index:99;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* bottom tabs (mobile) */
  .bottom-tabs{display:none;}
  @media(max-width:767px){
    .sidebar{display:none;}
    .topbar{padding-left:16px;padding-right:16px;}
    .banner{margin:12px 14px 0;}
    .content{padding:14px 14px 90px;}
    .remind{margin:12px 14px 0;}
    .bottom-tabs{
      display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0F2A2B;
      padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 18px rgba(0,0,0,.18);
    }
    .bottom-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:#9FBAB6;font-size:11px;position:relative;}
    .bottom-tabs button svg{width:22px;height:22px;}
    .bottom-tabs button.active{color:#fff;}
    .bottom-tabs button .badge{position:absolute;top:4px;right:50%;margin-right:-22px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;}
    .form .field{min-width:100%;}
    .btn{width:100%;}
    .topbar .tbtn span{display:none;}
    .topbar .tbtn{padding:9px 11px;}
  }

  /* ============ UI 优化增强（覆盖层，置于原始规则之后） ============ */
  /* 焦点可见性 & 减弱动效 */
  button:focus-visible,.tbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  /* 侧边栏 */
  .sidebar{
    width:236px;flex:0 0 236px;
    background:linear-gradient(180deg,#10312F 0%,#0C2725 100%);
    border-right:1px solid rgba(255,255,255,.05);
  }
  .brand{padding:24px 22px 16px;}
  .brand .logo{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .brand .logo .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(14,156,138,.4);}
  .brand .logo .mk svg{width:20px;height:20px;color:#fff;}
  .brand p{margin:6px 0 0;font-size:11.5px;color:#7FA39D;letter-spacing:.4px;}
  .nav{padding:10px 14px;}
  .nav button{gap:12px;padding:11px 13px;border-radius:12px;color:#BBD6D2;font-size:14px;font-weight:500;margin-bottom:4px;position:relative;transition:.18s var(--ease);}
  .nav button svg{width:19px;height:19px;flex:0 0 19px;opacity:.85;}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav button.active{background:linear-gradient(90deg,rgba(14,156,138,.24),rgba(14,156,138,.05));color:#fff;font-weight:600;}
  .nav button.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--teal);}
  .nav button.active svg{opacity:1;}
  .side-foot{border-top:1px solid rgba(255,255,255,.07);}

  /* 顶部栏 */
  .save-state{padding:6px 11px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .dot{width:9px;height:9px;box-shadow:0 0 0 4px rgba(43,162,76,.16);transition:.3s var(--ease);}
  .dot.flash{background:var(--teal);box-shadow:0 0 0 5px rgba(14,156,138,.22);}
  .tbtn{padding:9px 14px;border-radius:11px;box-shadow:var(--shadow-sm);transition:.16s var(--ease);}
  .tbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--line-2);}
  .tbtn:active{transform:translateY(0);}
  .tbtn.primary{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;border-color:transparent;}
  .tbtn.primary:hover{box-shadow:0 6px 16px rgba(14,156,138,.35);}
  .tbtn.ghost{background:transparent;box-shadow:none;}

  /* 页头横幅 */
  .banner{margin:18px 22px 0;background:linear-gradient(115deg,#0E9C8A 0%,#12A89A 42%,#2F6FED 100%);padding:18px 22px;gap:26px;border-radius:var(--radius);box-shadow:0 10px 28px rgba(14,120,138,.28);}
  .banner::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% -20%,rgba(255,255,255,.22),transparent 55%);pointer-events:none;}
  .banner .deco{position:absolute;right:0;top:0;opacity:.16;height:100%;}
  .banner .stat{line-height:1.1;}
  .banner .stat+.stat{padding-left:26px;border-left:1px solid rgba(255,255,255,.25);}
  .banner .stat b{font-size:24px;letter-spacing:.5px;}
  .banner .stat span{margin-top:3px;}
  .banner .lead{margin-left:auto;max-width:260px;line-height:1.6;}

  /* 内容 & 卡片 */
  .content{padding:20px 22px 48px;flex:1;width:100%;}
  .content.view-anim .card{animation:cardIn .35s var(--ease) both;}
  .card:hover{box-shadow:var(--shadow-md);}
  .card h2{gap:10px;font-weight:700;color:var(--ink);}
  .card h2 svg{width:18px;height:18px;color:#fff;background:linear-gradient(135deg,var(--teal),var(--blue));padding:5px;border-radius:9px;flex:0 0 auto;}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* 分区标题 */
  .sect-title{font-size:12.5px;margin:20px 0 10px;gap:10px;letter-spacing:.3px;}
  .sect-title::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--teal);display:inline-block;}
  .sect-title.overdue::before{background:var(--red);}
  .sect-title .cnt{padding:2px 9px;border-radius:9px;}

  /* 任务行 */
  .item{padding:14px 15px;border:1px solid var(--line);border-left:3px solid transparent;border-radius:13px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s,transform .12s var(--ease);}
  .item:hover{border-color:#cfe0dc;box-shadow:var(--shadow-sm);transform:translateX(2px);}
  .item.over{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-bg),#fff 42%);}
  .ck{border-radius:8px;transition:.18s var(--ease);cursor:pointer;}
  .ck:hover{border-color:var(--teal);}
  .ck.on{background:linear-gradient(135deg,var(--teal),var(--teal-d));border-color:transparent;box-shadow:0 2px 6px rgba(14,156,138,.3);}
  .pill{padding:10px;border-radius:9px;line-height:1;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;box-sizing:border-box;}
  .pill svg{width:12px;height:12px;flex:0 0 12px;display:block;}

  /* 按钮 */
  .btn{background:linear-gradient(135deg,var(--teal),var(--teal-d));border:1px solid transparent;box-shadow:0 3px 10px rgba(14,156,138,.22);border-radius:11px;transition:.16s var(--ease);}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(14,156,138,.32);}
  .btn:active{transform:translateY(0);}
  .btn.blue{background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 3px 10px rgba(47,111,237,.22);}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .btn.ghost:hover{border-color:var(--line-2);box-shadow:var(--shadow-md);}
  .btn.danger{box-shadow:none;}
  .btn.danger:hover{background:var(--red-bg);box-shadow:none;}

  .iconbtn{border-radius:10px;transition:.15s var(--ease);}
  .iconbtn:hover{background:#E7EEEC;color:var(--ink);transform:translateY(-1px);}
  .iconbtn.red:hover{background:var(--red-bg);color:var(--red);}

  /* 表单 */
  .field input,.field select,.field textarea{border-radius:11px;padding:11px 13px;font-size:16px;transition:.15s var(--ease);}
  .field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 3px var(--teal-l);}

  /* 标签筛选 */
  .chip{padding:7px 14px;border-radius:20px;transition:.15s var(--ease);cursor:pointer;}
  .chip:hover{border-color:var(--teal);color:var(--teal-d);}
  .chip.on{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(14,156,138,.25);}

  /* 项目卡片 */
  .proj{border-radius:14px;padding:16px;margin-bottom:14px;transition:.18s var(--ease);}
  .proj:hover{box-shadow:var(--shadow-sm);}
  .proj .pname{font-size:16px;}
  .proj .pflag{padding:3px 9px;border-radius:9px;}
  .proj .steps{gap:11px;margin-top:13px;}
  .step{background:#F6F9FA;border-radius:11px;padding:11px 13px;border:1px solid #EDF2F3;}
  .step.block{background:var(--red-bg);border-color:var(--red-line);}
  .step .k{margin-bottom:4px;}
  .step .v{color:var(--ink-2);line-height:1.5;}
  .progress{margin-top:14px;background:#FBFCFC;border:1px solid #EDF2F3;border-radius:11px;padding:12px 13px;}
  .progress .bar{height:9px;}
  .progress .bar i{transition:width .5s var(--ease);}
  .progress .lab{margin-bottom:7px;font-weight:600;}
  .linked{margin-top:12px;padding-top:10px;}
  .linked .li{padding:7px 0;}

  /* KPI */
  .kpi-row{gap:14px;margin-bottom:18px;}
  .kpi{padding:18px;transition:.18s var(--ease);}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .kpi b{font-size:30px;letter-spacing:.5px;}
  .kpi span{margin-top:4px;}

  /* 图表条 */
  .barrow .track i{transition:width .6s var(--ease);}
  .trend .col .b{transition:height .4s var(--ease);box-shadow:0 2px 6px rgba(14,156,138,.2);}

  /* 空状态 */
  .empty{padding:24px 0;background:#FBFCFC;border:1px dashed var(--line);border-radius:12px;margin:6px 0;}

  /* 提示条 & Toast */
  .remind{padding:13px 15px;border-radius:13px;box-shadow:var(--shadow-sm);gap:11px;}
  .remind button{transition:.15s var(--ease);}
  .remind button:hover{background:rgba(138,90,6,.1);}
  .toast{bottom:30px;padding:13px 22px;border-radius:13px;box-shadow:0 12px 34px rgba(0,0,0,.3);backdrop-filter:blur(6px);}

  /* 移动端底部 Tab 激活指示 */
  .bottom-tabs button.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--teal);}

  /* 图表入场 */
  .donut-pop{animation:donutPop .5s var(--ease) both;transform-origin:center;}
  @keyframes donutPop{from{transform:scale(.82);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* ============ 空状态视觉增强 ============ */
  .empty{text-align:center;color:var(--muted);}
  .empty svg{display:block;margin:0 auto 8px;}

  /* ============ 文件搜索模块 ============ */
  .file-search{position:relative;}
  .file-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;}
  .file-search input{border:1px solid var(--line);border-radius:11px;padding:12px 13px 12px 40px;font-size:16px;width:100%;min-height:46px;background:#fff;outline:none;transition:.15s var(--ease);}
  .file-search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l);}
  .file-chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 4px;}
  .file-stat{flex:1;min-width:130px;background:var(--teal-ll);border:1px solid #d6ece7;border-radius:12px;padding:12px 14px;transition:.15s var(--ease);}
  .file-stat:hover{box-shadow:var(--shadow-sm);}
  .file-stat b{font-size:19px;font-weight:800;color:var(--teal-d);}
  .file-stat span{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
  .file-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;transition:border-color .15s,box-shadow .15s,transform .12s var(--ease);}
  .file-row:hover{border-color:#cfe0dc;box-shadow:var(--shadow-sm);transform:translateX(2px);}
  .file-row .ficon{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .file-row .ficon svg{width:19px;height:19px;}
  .file-row .fbody{flex:1;min-width:0;}
  .file-row .fname{font-weight:600;word-break:break-word;display:flex;align-items:center;gap:8px;}
  .file-row .fext{font-size:10px;font-weight:700;background:var(--blue-l);color:var(--blue);padding:1px 7px;border-radius:7px;flex:0 0 auto;}
  .file-row .fpath{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-row .fmeta{font-size:12px;color:var(--muted);flex:0 0 auto;text-align:right;line-height:1.6;}
  .file-row .fmeta b{color:var(--ink-2);font-weight:600;}
  .file-row .file-actions{display:flex;gap:6px;flex:0 0 auto;}
  .file-hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6;}

  /* ---------- project folders (文件管理) ---------- */
  .proj-folder{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;background:#fff;overflow:hidden;transition:.15s var(--ease);}
  .proj-folder:hover{box-shadow:var(--shadow-sm);}
  .pf-head{display:flex;align-items:center;gap:12px;padding:13px 15px;background:linear-gradient(180deg,#FBFDFD,#fff);border-bottom:1px solid var(--line);}
  .pf-ico{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:var(--teal-l);color:var(--teal-d);display:flex;align-items:center;justify-content:center;}
  .pf-ico svg{width:20px;height:20px;}
  .pf-titles{flex:1;min-width:0;}
  .pf-name{font-weight:700;font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pf-root{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pf-meta{font-size:12px;color:var(--muted);flex:0 0 auto;margin-right:2px;}
  .pf-cats{display:flex;gap:7px;flex-wrap:wrap;padding:11px 15px;background:#FBFDFD;border-bottom:1px solid var(--line);}
  .pf-catpill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:9px;white-space:nowrap;}
  .pf-catpill b{font-weight:800;}
  .pf-body{padding:8px 12px 12px;}
  .cat-group{margin-top:8px;}
  .cat-title{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:6px;}
  .cat-title b{margin-left:2px;}
  .cat-dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
  .cat-sel{border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:13px;min-height:38px;background:#fff;outline:none;color:var(--ink);cursor:pointer;flex:0 0 auto;}
  .cat-sel:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l);}
  .fproj{font-size:10px;font-weight:700;background:var(--teal-l);color:var(--teal-d);padding:1px 7px;border-radius:7px;flex:0 0 auto;}
  @media (max-width:560px){
    .file-row{flex-wrap:wrap;row-gap:8px;}
    .file-row .cat-sel{order:5;flex:1 1 100%;}
    .pf-head{flex-wrap:wrap;}
    .pf-meta{order:4;flex:1 1 100%;}
  }

  /* ---------- project create + helpers ---------- */
  .proj-create{margin-bottom:4px;}
  .linkbtn{margin-left:auto;border:1px solid var(--line);border-radius:9px;padding:5px 11px;font-size:12.5px;color:var(--teal-d);background:#fff;font-weight:600;white-space:nowrap;}
  .linkbtn:hover{background:var(--teal-l);}
  .clr{border:none;background:var(--line);color:var(--muted);border-radius:50%;width:26px;height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .clr:hover{background:var(--red-line);color:var(--red);}
  .fsnip{font-size:11.5px;color:var(--muted);margin-top:4px;background:#FBFCFC;border:1px dashed var(--line-2);border-radius:8px;padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fsnip mark{background:#FFF1B8;color:#7a5b00;border-radius:2px;}

  /* ---------- preview modal ---------- */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-mask{position:absolute;inset:0;background:rgba(16,30,34,.45);backdrop-filter:blur(2px);}
  .modal-card{position:relative;width:min(900px,100%);max-height:88vh;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;animation:modalIn .18s var(--ease);}
  @keyframes modalIn{from{transform:translateY(12px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
  .modal-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .mh-left{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}
  .mh-left .ficon{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .mh-left .ficon svg{width:19px;height:19px;}
  .mh-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
  .mh-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .mh-actions{display:flex;gap:6px;flex:0 0 auto;}
  .modal-sub{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#FBFDFD;border-bottom:1px solid var(--line);}
  .pv-path{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .modal-body{padding:14px 16px;overflow:auto;flex:1;}
  .pv-text{margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;color:var(--ink-2);}
  .pv-text mark{background:#FFF1B8;color:#7a5b00;border-radius:3px;padding:0 2px;}
  .pv-media{display:flex;justify-content:center;}
  .pv-media img{max-width:100%;max-height:62vh;border-radius:10px;box-shadow:var(--shadow-sm);}
  .pv-media iframe{width:100%;height:62vh;border:none;border-radius:10px;background:#525659;}
  .pv-note{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 10px;line-height:1.7;}
  @media (max-width:560px){
    .modal{padding:8px;}
    .mh-actions .iconbtn{padding:8px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M3 9h6"/></svg></span>
        <h1>个人办公工作台</h1>
      </div>
      <p>Office Workbench · 离线可用</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">数据自动保存在本机浏览器<br>支持导出 / 导入迁移</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M3 9h6"/></svg>
        <span id="viewTitle">今日</span>
      </div>
      <div class="save-state"><span class="dot" id="saveDot"></span><span id="saveTxt">已保存</span></div>
      <div class="spacer"></div>
      <button class="tbtn" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg><span>导出备份</span></button>
      <button class="tbtn ghost" id="btnImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M5 21h14"/></svg><span>导入</span></button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden>
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
      <input type="file" id="fileInput2" multiple hidden>
    </header>

    <div class="remind" id="remind" style="display:none">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span id="remindTxt"></span>
      <button id="remindExport">立即导出</button>
      <button id="remindClose">知道了</button>
    </div>

    <div class="banner" id="banner"></div>

    <div class="content" id="content"></div>
  </main>

  <nav class="bottom-tabs" id="bottomTabs"></nav>
</div>

<div class="toast" id="toast"></div>
<div id="previewModal" class="modal" style="display:none"></div>

<script>
/* ============ 小台 · 个人办公工作台 ============ */
const KEY = "wb_office_workbench_v1";
const KEY_FILES = "wb_office_workbench_files_v1";
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];

/* ---------- icons ---------- */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/><path d="M4 12.5V20h16"/></svg>',
  bulb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  fwd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v5l9 9 7-7-9-9H3z"/><circle cx="7.5" cy="7.5" r="1.4" fill="currentColor"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  chevronL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  chevronR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};
const VIEWS = [
  {id:'today',label:'今日',icon:I.home},
  {id:'todos',label:'待办',icon:I.check},
  {id:'notes',label:'灵感',icon:I.bulb},
  {id:'projects',label:'项目',icon:I.folder},
  {id:'review',label:'复盘',icon:I.chart},
];

/* ---------- date helpers ---------- */
function fmtDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${da}`;}
function todayStr(){return fmtDate(new Date());}
function addDays(str,n){const d=new Date(str+'T00:00:00');d.setDate(d.getDate()+n);return fmtDate(d);}
function isOverdue(t){return !t.done && t.deadline && t.deadline < todayStr();}
function isToday(t){return !t.done && t.deadline === todayStr();}
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function weekStart(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);return d;}

/* ---------- state ---------- */
let state;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.tasks)return d;}}catch(e){}
  return sampleData();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  flashSaved();
}
function flashSaved(){
  const dot=$('#saveDot'),txt=$('#saveTxt');
  dot.classList.add('flash');txt.textContent='保存中…';
  clearTimeout(flashSaved._t);
  flashSaved._t=setTimeout(()=>{dot.classList.remove('flash');txt.textContent='已保存';},500);
}

function sampleData(){
  const t=todayStr();
  return {
    tasks:[
      {id:uid(),text:'整理 Q3 季度汇报材料',priority:'high',deadline:addDays(t,-2),done:false,deferCount:1,projectId:null,createdAt:Date.now()-86400000*3,completedAt:null},
      {id:uid(),text:'回复客户邮件并确认排期',priority:'medium',deadline:t,done:false,deferCount:0,projectId:null,createdAt:Date.now()-3600000,completedAt:null},
      {id:uid(),text:'提交上月差旅报销单',priority:'high',deadline:t,done:false,deferCount:0,projectId:null,createdAt:Date.now()-7200000,completedAt:null},

/* ---------- counts ---------- */
function counts(){
  const overdue=state.tasks.filter(isOverdue).length;
  const today=state.tasks.filter(isToday).length;
  const blocked=state.projects.filter(p=>p.blocker && p.blocker.trim()).length;
  return {overdue,today,blocked};
}

/* ---------- task row (shared) ---------- */
function taskRow(t,overMode){
  const pLabel={high:'高',medium:'中',low:'低'}[t.priority];
  const proj=t.projectId?state.projects.find(p=>p.id===t.projectId):null;
  let deferInfo = t.deferCount>0?`<span class="pill defer">已顺延 ${t.deferCount} 次</span>`:'';
  const over=isOverdue(t);
  return `<div class="item ${over?'over':''} ${t.done?'done':''}" data-id="${t.id}">
    <div class="ck ${t.done?'on':''}" data-act="toggle">${t.done?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg>':''}</div>
    <div class="body">
      <div class="txt">${esc(t.text)}</div>
      <div class="meta">
        <span class="pill p-${t.priority}">${pLabel}</span>
        <span class="pill date">${t.deadline}${over?' · 逾期':(t.deadline===todayStr()?' · 今天':'')}</span>
        ${proj?`<span class="pill proj">${I.folder} ${esc(proj.name)}</span>`:''}
        ${deferInfo}
      </div>
    </div>
    <div class="acts">
      ${over&&!t.done?`<button class="btn sm ghost" data-act="defer">顺延到明天</button>`:''}
      <button class="iconbtn red" data-act="del" title="删除">${I.trash}</button>
    </div>
  </div>`;
}
function bindTaskRows(){
  $$('#content .item').forEach(el=>{
    const id=el.dataset.id,t=state.tasks.find(x=>x.id===id);if(!t)return;
    el.querySelector('[data-act="toggle"]').onclick=()=>toggleTask(t);
    el.querySelector('[data-act="del"]').onclick=()=>delTask(t);
    const df=el.querySelector('[data-act="defer"]');if(df)df.onclick=()=>deferTask(t);
  });
}
function toggleTask(t){t.done=!t.done;t.completedAt=t.done?(new Date().toISOString()):null;save();renderAll();toast(t.done?'已完成 ✓':'已标记为未完成');}
function delTask(t){if(!confirm('删除这条任务？'))return;state.tasks=state.tasks.filter(x=>x.id!==t.id);save();renderAll();toast('已删除');}
function deferTask(t){t.deadline=addDays(t.deadline,1);t.deferCount=(t.deferCount||0)+1;save();renderAll();toast('已顺延到 '+t.deadline+'（第 '+t.deferCount+' 次）');}

/* ---------- view: TODOS ---------- */
function renderTodos(){
  let h=`<div class="card"><h2>${I.check} 今天待办 <span class="sub">填任务 · 选轻重缓急 · 设截止日 · 完成打勾</span></h2>
    <div class="form">

      <div class="field"><label>轻重缓急</label><select id="tPri">
        <option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></div>
      <div class="field"><label>截止日期</label><input id="tDate" type="date" value="${todayStr()}"></div>
      <div class="field"><label>关联项目</label><select id="tProj"><option value="">无</option>${state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <button class="btn" id="tAdd">${I.plus} 添加</button>
    </div>
    <div class="sub" style="font-size:12px;color:var(--muted);margin-top:8px">提示：逾期任务会标红，可一键顺延到明天；昨天没做完的会自动留在今日，不会消失。</div>
  </div>`;

  const over=state.tasks.filter(isOverdue);
  const tod=state.tasks.filter(isToday);
  const done=state.tasks.filter(t=>t.done);
  const future={};
  state.tasks.filter(t=>!t.done&&t.deadline>todayStr()).forEach(t=>{(future[t.deadline]=future[t.deadline]||[]).push(t);});
  const futureKeys=Object.keys(future).sort();

  h+=`<div class="card">`;
  h+=`<div class="sect-title overdue">逾期未完成<span class="cnt">${over.length}</span></div>`;
  if(over.length)h=addRows(h,over,true);else h+=`<div class="empty">没有逾期任务。</div>`;
  h+=`<div class="sect-title">今天<span class="cnt">${tod.length}</span></div>`;
  if(tod.length)h=addRows(h,tod,false);else h+=`<div class="empty">今天没有待办，去上面加一条吧。</div>`;
  futureKeys.forEach(k=>{
    h+=`<div class="sect-title">${k}（未来）<span class="cnt">${future[k].length}</span></div>`;
    h=addRows(h,future[k],false);
  });
  h+=`<div class="sect-title">已完成<span class="cnt">${done.length}</span></div>`;
  if(done.length)h=addRows(h,done,false);else h+=`<div class="empty">还没有完成的任务。</div>`;
  h+=`</div>`;
  $('#content').innerHTML=h;

  $('#tAdd').onclick=()=>{
    const text=$('#tText').value.trim();if(!text){toast('先写点任务内容');return;}
    state.tasks.push({id:uid(),text,priority:$('#tPri').value,deadline:$('#tDate').value||todayStr(),done:false,deferCount:0,projectId:$('#tProj').value||null,createdAt:Date.now(),completedAt:null});
    save();renderAll();toast('已添加');$('#tText').focus();
  };
  bindTaskRows();
}
function addRows(h,arr,over){arr.forEach(t=>h+=taskRow(t,over));return h;}

/* ---------- view: REVIEW (weekly) ---------- */
function renderReview(){
  const ws=weekStart();
  const wsISO=ws.toISOString();
  const doneWeek=state.tasks.filter(t=>t.done&&t.completedAt&&t.completedAt>=wsISO);
  const byPri={high:0,medium:0,low:0};
  doneWeek.forEach(t=>byPri[t.priority]++);
  const totalWeek=doneWeek.length;
  // energy by project: linked task counts
  const projEnergy=state.projects.map(p=>{
    const linked=state.tasks.filter(t=>t.projectId===p.id);
    return {name:p.name,total:linked.length,done:linked.filter(t=>t.done).length,blocked:!!(p.blocker&&p.blocker.trim())};
  }).sort((a,b)=>b.total-a.total);
  const maxEnergy=Math.max(1,...projEnergy.map(p=>p.total));
  const blockers=state.projects.filter(p=>p.blocker&&p.blocker.trim());
  // 7-day trend
  const days=[];for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);days.push(d);}
  const dayDone=days.map(d=>{const s=fmtDate(d);return state.tasks.filter(t=>t.done&&t.completedAt&&t.completedAt.slice(0,10)===s).length;});
  const maxDay=Math.max(1,...dayDone);

  let h=`<div class="card"><h2>${I.chart} 每周复盘 <span class="sub">自动汇总本周数据</span></h2>
    <div class="kpi-row">
      <div class="kpi"><b>${totalWeek}</b><span>本周完成事项</span></div>
      <div class="kpi amber"><b>${byPri.high}</b><span>高优先完成</span></div>
      <div class="kpi blue"><b>${projEnergy.filter(p=>p.total>0).length}</b><span>涉及项目</span></div>
      <div class="kpi red"><b>${blockers.length}</b><span>卡住项目</span></div>
    </div>`;

  // priority distribution donut
  h+=`<div class="grid2">
    <div class="card" style="margin:0"><h2>优先级分布</h2><div class="chart-wrap">
      ${donut([{label:'高',value:byPri.high,color:'#E5484D'},{label:'中',value:byPri.medium,color:'#E8941A'},{label:'低',value:byPri.low,color:'#2F6FED'}],150)}
      <div class="legend">
        <div class="lg"><span class="sw" style="background:#E5484D"></span>高优先 ${byPri.high}</div>
        <div class="lg"><span class="sw" style="background:#E8941A"></span>中优先 ${byPri.medium}</div>
        <div class="lg"><span class="sw" style="background:#2F6FED"></span>低优先 ${byPri.low}</div>
      </div></div></div>`;

  // energy by project bars
  h+=`<div class="card" style="margin:0"><h2>精力分布（关联待办数）</h2><div class="bars">`;
  if(projEnergy.length===0)h+=`<div class="empty">还没有项目。</div>`;
  projEnergy.forEach(p=>{
    h+=`<div class="barrow"><span class="nm">${esc(p.name)}</span><span class="track"><i style="width:${p.total/maxEnergy*100}%"></i></span><span class="vv">${p.total}</span></div>`;
  });
  h+=`</div></div></div>`;

  // trend
  h+=`<div class="card"><h2>本周每日完成趋势</h2><div class="trend">`;
  days.forEach((d,i)=>{
    h+=`<div class="col"><div class="b" style="height:${dayDone[i]/maxDay*70}px" title="${dayDone[i]} 项"></div><div class="d">${d.getMonth()+1}/${d.getDate()}</div></div>`;
  });
  h+=`</div></div>`;

  // blockers summary
  h+=`<div class="card"><h2>卡点汇总</h2>`;
  if(blockers.length===0)h+=`<div class="empty">本周没有卡住的项目，推进顺利。</div>`;
  else{h+='<ul class="blockers">';blockers.forEach(p=>{h+=`<li><span class="pj">${esc(p.name)}：</span>${esc(p.blocker)}（下一步：${esc(p.next)||'—'}）</li>`;});h+='</ul>';}
  h+=`</div></div>`;

  $('#content').innerHTML=h;
}

function donut(segments,size){
  const total=segments.reduce((s,x)=>s+x.value,0);
  const r=size/2-16,c=2*Math.PI*r;
  let offset=0,paths='';
  if(total===0){
    paths=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EDF1F2" stroke-width="15"/>`;
  }else{
    segments.forEach(seg=>{
      if(seg.value<=0)return;
      const len=seg.value/total*c;
      paths+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="15" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
      offset+=len;
    });
  }
  return `<svg class="donut-pop" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="#1F2A30">${total}</text><text x="${size/2}" y="${size/2+22}" text-anchor="middle" font-size="11" fill="#6B7B83">本周完成</text></svg>`;
}

function readContent(fid,f){try{const r=new FileReader();r.onload=()=>{let t=String(r.result||'');if(t.length>CONFIG.maxContentChars)t=t.slice(0,CONFIG.maxContentChars);fileContent[fid]=t;saveFileContent();};r.onerror=()=>{};r.readAsText(f);}catch(e){}}
function getContent(fid){
  if(fileContent[fid]!=null)return Promise.resolve(fileContent[fid]);
  const found=findFile(fid);const ext=found?found.f.ext:'';const b=fileBlobs[fid];
  if(b&&isTextExt(ext))return new Promise(res=>{const r=new FileReader();r.onload=()=>{let t=String(r.result||'');if(t.length>CONFIG.maxContentChars)t=t.slice(0,CONFIG.maxContentChars);fileContent[fid]=t;saveFileContent();res(t);};r.onerror=()=>res('');r.readAsText(b);});
  return Promise.resolve(null);

function highlight(text,q){const e=esc(text);if(!q)return e;const eq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return e.replace(new RegExp('('+eq+')','gi'),'<mark>$1</mark>');}catch(_){return e;}}
function contentSnippet(fid,q){if(!q)return null;const t=fileContent[fid];if(!t)return null;const i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return null;const s=Math.max(0,i-30),e=Math.min(t.length,i+q.length+30);return (s>0?'…':'')+t.slice(s,e).replace(/\r?\n/g,' ')+(e<t.length?'…':'');}

function fCat(ext){

  if(list.length>300)out+=`<div class="file-hint">仅显示前 300 条，共匹配 ${list.length} 条，请缩小搜索范围。</div>`;
  box.innerHTML=out;
  bindFileRowEvents();
}
function bindFileRowEvents(){
  $$('.file-row').forEach(row=>{
    const fid=row.dataset.fid;if(!fid)return;
    const fb=row.querySelector('.fbody');if(fb)fb.onclick=()=>openPreview(fid);
    const pe=row.querySelector('[data-preview]');if(pe)pe.onclick=e=>{e.stopPropagation();openPreview(fid);};
    const ce=row.querySelector('[data-copy]');if(ce)ce.onclick=e=>{e.stopPropagation();copyPath(ce.dataset.copy);};
  });
  $$('.cat-sel').forEach(s=>s.onchange=()=>{
    const found=findFile(s.dataset.fid);if(!found)return;
    found.f.category=s.value;save();toast('已归类为「'+catLabel(s.value)+'」');
    if(fileQ.trim()||fileFilter!=='all')renderProjectResults();else renderProjectList();
  });
}
function bindProjectEvents(){
  $$('[data-pdel]').forEach(b=>b.onclick=()=>{
    const p=state.projects.find(x=>x.id===b.dataset.pdel);if(!p)return;
    if(!confirm(`删除项目「${p.name}」？关联待办仅解除关联，不会删除。归档文件将一并删除。`))return;
    state.projects=state.projects.filter(x=>x.id!==p.id);
    state.tasks.forEach(t=>{if(t.projectId===p.id)t.projectId=null;});
    pruneContent();save();renderAll();toast('已删除项目');
  });
  $$('[data-pimp]').forEach(b=>b.onclick=()=>{const inp=$('#fileInput2');inp.dataset.pid=b.dataset.pimp;inp.click();});
  $$('[data-ptoggle]').forEach(b=>b.onclick=()=>{const el=$('#pfb-'+b.dataset.ptoggle);if(el)el.style.display=el.style.display==='none'?'block':'none';});
  $$('[data-tid]').forEach(el=>el.onclick=()=>{const t=state.tasks.find(x=>x.id===el.dataset.tid);if(t)toggleTask(t);});
  bindFileRowEvents();
}

/* ---------- export / import ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='办公工作台备份-'+todayStr()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('已导出备份文件');
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d||!Array.isArray(d.tasks)){toast('文件格式不对，不是工作台备份');return;}
      state={tasks:d.tasks||[],notes:d.notes||[],projects:d.projects||[],meta:d.meta||{isSample:false,lastReminder:0,version:1}};
      if(!state.meta)state.meta={};
      ensureProjectFiles();
      save();renderAll();toast('导入成功，数据已恢复');
    }catch(e){toast('解析失败，请确认是有效的备份文件');}
  };
  reader.readAsText(file);
}

/* ---------- 20-item reminder ---------- */
function totalItems(){return state.tasks.length+state.notes.length+state.projects.length;}
function checkReminder(){
  const total=totalItems();
  const threshold=Math.floor(total/20)*20;
  if(total>=20&&(state.meta.lastReminder||0)<threshold){
    state.meta.lastReminder=threshold;save();
    $('#remind').style.display='flex';
    $('#remindTxt').textContent=`数据已积累 ${total} 条，建议导出一次备份，避免浏览器清缓存后丢失。`;
  }
}
$('#remindClose').onclick=()=>{$('#remind').style.display='none';};
$('#remindExport').onclick=()=>{exportData();$('#remind').style.display='none';};

/* ---------- clear sample ---------- */
function maybeClearSample(){
  if(state.meta&&state.meta.isSample){
    // offer once after first interaction is complex; provide a persistent button in today view footer
  }
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ---------- boot ---------- */
let cur='today';
$('#btnExport').onclick=exportData;
$('#btnImport').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';};
$('#folderInput').onchange=async e=>{
  const fs=e.target.files;if(!fs||!fs.length){e.target.value='';return;}
  const first=fs[0].webkitRelativePath||fs[0].name;
  const projName=first.includes('/')?first.split('/')[0]:(fs[0].name.replace(/\.[^.]+$/,'')||'导入文件夹');
  const root=first.includes('/')?first.split('/')[0]:'';
  const arr=[];
  for(const f of fs){
    const rp=f.webkitRelativePath||f.name;
    const ext='.'+(f.name.split('.').pop()||'').toLowerCase();
    const fid=uid();
    arr.push({id:fid,name:f.name,path:rp,size:f.size,mtime:f.lastModified,ext,category:classifyFile(f.name)});
    fileBlobs[fid]=f;
    if(isTextExt(ext)&&f.size<=CONFIG.maxContentBytes)readContent(fid,f);
  }
  addFilesToProject(projName,root,arr);
  e.target.value='';
};
$('#fileInput2').onchange=async e=>{
  const fs=e.target.files;if(!fs||!fs.length){e.target.value='';e.target.dataset.pid='';return;}
  const pid=e.target.dataset.pid;const p=state.projects.find(x=>x.id===pid);
  if(!p){toast('请先选择一个目标项目');e.target.value='';e.target.dataset.pid='';return;}
  const arr=[];
  for(const f of fs){
    const ext='.'+(f.name.split('.').pop()||'').toLowerCase();
    const fid=uid();
    arr.push({id:fid,name:f.name,path:f.name,size:f.size,mtime:f.lastModified,ext,category:classifyFile(f.name)});
    fileBlobs[fid]=f;
    if(isTextExt(ext)&&f.size<=CONFIG.maxContentBytes)readContent(fid,f);
  }
  const have=new Set(p.files.map(x=>x.path));let added=0;
  arr.forEach(f=>{if(!have.has(f.path)){p.files.push(f);added++;}});
  save();saveFileContent();renderAll();
  toast(added?`已添加 ${added} 个文件到「${p.name}」`:`「${p.name}」已是最新`);
  e.target.value='';e.target.dataset.pid='';
};

/* add "清空示例" entry in today view: inject a small card after first render via hook */
const _renderToday=renderToday;
renderToday=function(){
  _renderToday();
  if(state.meta&&state.meta.isSample){
    const c=$('#content');
    const div=document.createElement('div');
    div.className='card';
    div.style.textAlign='center';
    div.innerHTML=`<h2 style="justify-content:center">${I.trash} 示例数据</h2>
      <div style="color:var(--muted);font-size:13px;margin-bottom:12px">当前展示的是预置示例，看清楚效果后点下方按钮清空，再填你自己的内容。</div>
      <button class="btn danger" id="clearSample">清空示例数据</button>`;
    c.appendChild(div);
    $('#clearSample').onclick=()=>{
      if(!confirm('确定清空所有示例数据？真实填写的内容也会被清空，建议先导出备份。'))return;
      state.tasks=[];state.notes=[];state.projects=[];state.meta.isSample=false;fileContent={};fileBlobs={};saveFileContent();save();renderAll();toast('已清空示例数据');
    };
  }
};

state = load();
loadFileContent();
migrateFileProjects();
ensureProjectFiles();
seedSampleContent();
/* link a couple sample tasks to projects for demo */
(function linkSample(){
  if(state.projects.length>=2){
    state.tasks[1].projectId=state.projects[1].id;
    state.tasks[3].projectId=state.projects[0].id;
    state.tasks[4].projectId=state.projects[0].id;
  }
})();
renderAll();
</script>
